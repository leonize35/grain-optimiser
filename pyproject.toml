[project]
name = "silo-engine"
version = "0.3.0.dev0"
description = "Independent, configuration-driven discrete-event simulation engine for grain silos"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]
api = ["fastapi>=0.162", "uvicorn>=0.54"]  # HTTP API for the silo builder (step 8); the engine needs only pydantic

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
