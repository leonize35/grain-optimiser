<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Silo Decision Lab</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control-room workbench. Steel header band, workflow tabs that follow the manager's sequence,
   then one working surface per step. Data in mono, headings in condensed industrial caps, maize as the single accent. */
:root {
  --ground: #e9edec; --surface: #fbfcfb; --sunk: #f1f4f3; --ink: #1b2225; --muted: #59666a; --line: #cdd5d4;
  --band: #23343c; --band-ink: #eef3f2; --band-muted: #a9bcc2;
  --maize: #b97c06; --maize-ink: #ffffff; --maize-soft: #f4e6c3; --steel: #3d6475; --steel-soft: #dbe6ea;
  --good: #2c7a4b; --good-soft: #dcefe3; --warn: #a9620c; --warn-soft: #f6e6cf; --bad: #b1372b; --bad-soft: #f6dcd8;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #121719; --surface: #1a2124; --sunk: #151b1e; --ink: #e4eaea; --muted: #97a5a8; --line: #2e3a3e;
  --band: #0d1416; --band-ink: #e4eaea; --band-muted: #8ea2a8;
  --maize: #e2a630; --maize-ink: #1b1505; --maize-soft: #3b2f12; --steel: #86adbf; --steel-soft: #20323a;
  --good: #5cbf85; --good-soft: #17301f; --warn: #e3a04a; --warn-soft: #36270f; --bad: #ec7b6e; --bad-soft: #3a1b17; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #121719; --surface: #1a2124; --sunk: #151b1e; --ink: #e4eaea; --muted: #97a5a8; --line: #2e3a3e;
  --band: #0d1416; --band-ink: #e4eaea; --band-muted: #8ea2a8;
  --maize: #e2a630; --maize-ink: #1b1505; --maize-soft: #3b2f12; --steel: #86adbf; --steel-soft: #20323a;
  --good: #5cbf85; --good-soft: #17301f; --warn: #e3a04a; --warn-soft: #36270f; --bad: #ec7b6e; --bad-soft: #3a1b17; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--body); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.05; }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 1.1rem; }
p { margin: 0; max-width: 68ch; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--maize); outline-offset: 2px; }

/* header band */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.top { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--display); font-size: 1.3rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--band-muted); }
.top select { background: transparent; border: 1px solid #ffffff33; border-radius: var(--r); padding: 6px 8px; color: var(--band-ink); max-width: 220px; }
.top select option { color: #1b2225; }
.modes { display: inline-flex; border: 1px solid #ffffff33; border-radius: var(--r); overflow: hidden; }
.modes button { background: transparent; border: 0; padding: 6px 10px; color: var(--band-muted); cursor: pointer; font-size: 12.5px; }
.modes button[aria-pressed="true"] { background: var(--maize); color: var(--maize-ink); }
.tabs { background: var(--band); border-top: 1px solid #ffffff14; }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--band-muted); padding: 9px 12px 8px; cursor: pointer; font-family: var(--display); font-size: 1rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
.tabs button i { font-style: normal; font-family: var(--mono); font-size: 11px; margin-right: 6px; opacity: .7; }
.tabs button[aria-current="page"] { color: var(--band-ink); border-bottom-color: var(--maize); }

main { padding-block: 20px 60px; display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h2 + *, .panel > header + * { margin-top: 12px; }
.panel header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; justify-content: space-between; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--steel); }
.btn.primary { background: var(--maize); border-color: var(--maize); color: var(--maize-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { padding: 12px 18px; font-family: var(--display); font-size: 1.15rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--steel); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--maize-soft); color: var(--ink); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }

/* readiness ladder */
.ladder { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.ladder div { padding: 7px 8px 6px; background: var(--sunk); border-top: 3px solid var(--line); font-size: 11.5px; line-height: 1.25; color: var(--muted); }
.ladder div.done { border-top-color: var(--good); color: var(--ink); }
.ladder div.now { border-top-color: var(--maize); background: var(--maize-soft); color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* KPI tiles */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.kpi { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--surface); min-width: 0; }
.kpi .v { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .95rem; color: var(--muted); margin-left: 3px; font-weight: 500; }
.kpi .l { font-size: 12.5px; color: var(--muted); }
.kpi .ci { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.hl td { background: var(--maize-soft); }

/* bars */
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 70px; gap: 8px; align-items: center; font-size: 13px; }
.bar .t { height: 14px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar .f { height: 100%; background: var(--steel); }
.bar .f.hot { background: var(--maize); }
.bar .f.bad { background: var(--bad); }
.bar .val { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

/* forms */
label.f { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
label.f > span { font-weight: 500; }
input[type=text], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; color: var(--ink); width: 100%; min-width: 0; }
input[type=number] { font-family: var(--mono); }
.fields { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.trip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink); }
.checks label { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; }

/* sub navigation */
.subnav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.subnav button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
.subnav button i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: 5px; }
.subnav button[aria-current="step"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.subnav button[aria-current="step"] i { color: inherit; }

/* equipment list */
.eq { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); }
.eq.sel { border-color: var(--maize); box-shadow: 0 0 0 1px var(--maize); }
.eq .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.eq .head input[type=text] { width: auto; flex: 1 1 140px; font-weight: 600; }
.tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--steel-soft); color: var(--steel); }

/* network diagram */
.netwrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); cursor: grab; max-height: 560px; touch-action: pan-x pan-y; }
.netwrap.drag { cursor: grabbing; }
.netwrap svg { display: block; }
.node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.node text { fill: var(--ink); font: 500 12px var(--body); }
.node .ty { fill: var(--muted); font: 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
.node.sel rect { stroke: var(--maize); stroke-width: 2.4; }
.node.on rect { fill: var(--maize-soft); stroke: var(--maize); }
.node.shared rect { stroke-dasharray: 5 3; stroke: var(--steel); stroke-width: 1.8; }
.node.unreach rect { stroke: var(--bad); stroke-width: 2; }
.node.err rect { stroke: var(--bad); stroke-width: 2; fill: var(--bad-soft); }
.node { cursor: pointer; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .7; }
.edge.on { stroke: var(--maize); stroke-width: 2.6; opacity: 1; }
.edge.back { stroke-dasharray: 4 4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 18px; height: 11px; border-radius: 2px; border: 1.5px solid var(--line); display: inline-block; background: var(--surface); }
.sw.sh { border-style: dashed; border-color: var(--steel); }
.sw.on { background: var(--maize-soft); border-color: var(--maize); }
.sw.ur { border-color: var(--bad); }

/* truck path strip */
.path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.path .st { border: 1px solid var(--line); background: var(--sunk); border-radius: 4px; padding: 3px 7px; font-size: 12px; }
.path .st b { font-weight: 600; }
.path .ar { color: var(--muted); font-family: var(--mono); }

/* messages */
.msgs { display: grid; gap: 6px; }
.msg { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 8px 10px; border-radius: var(--r); font-size: 13.5px; align-items: start; }
.msg.e { background: var(--bad-soft); }
.msg.w { background: var(--warn-soft); }
.msg.i { background: var(--steel-soft); }
.msg.ok { background: var(--good-soft); }
.msg b.k { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.msg.e b.k { color: var(--bad); } .msg.w b.k { color: var(--warn); } .msg.i b.k { color: var(--steel); } .msg.ok b.k { color: var(--good); }

/* job dock */
#dock:empty { display: none; }
#dock { background: var(--surface); border-bottom: 1px solid var(--line); }
#dock .wrap { padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.states { display: flex; flex-wrap: wrap; gap: 2px; font-family: var(--mono); font-size: 11px; }
.states span { padding: 2px 6px; color: var(--muted); border-radius: 3px; }
.states span.done { color: var(--good); }
.states span.now { background: var(--maize); color: var(--maize-ink); }
.states span.fail { background: var(--bad); color: #fff; }
.prog { flex: 1 1 140px; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 100px; }
.prog i { display: block; height: 100%; background: var(--maize); transition: width .2s; }

/* question cards */
.qs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.q { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 3px; }
.q b { font-family: var(--display); font-size: 1.08rem; font-weight: 600; letter-spacing: .02em; }
.q span { font-size: 12.5px; color: var(--muted); }
.q[aria-pressed="true"] { border-color: var(--maize); background: var(--maize-soft); }

.answer { border-left: 4px solid var(--maize); padding: 4px 0 4px 14px; display: grid; gap: 6px; }
.answer p { font-size: 15px; }
.answer p b { font-weight: 600; }
.exploratory { display: flex; gap: 8px; align-items: center; background: var(--warn-soft); color: var(--ink); padding: 8px 12px; border-radius: var(--r); font-size: 13px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }

.profile { display: grid; grid-template-columns: repeat(24, minmax(28px, 1fr)); gap: 3px; min-width: 700px; }
.profile .c { display: grid; gap: 3px; justify-items: stretch; }
.profile .c .b { height: 60px; background: var(--sunk); border-radius: 2px; display: flex; align-items: flex-end; }
.profile .c .b i { display: block; width: 100%; background: var(--steel); border-radius: 2px 2px 0 0; }
.profile .c input { padding: 3px 2px; text-align: center; font-size: 11px; }
.profile .c small { text-align: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.profile .c.off { opacity: .45; }

pre.code { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; font: 12px/1.45 var(--mono); overflow: auto; max-height: 360px; margin: 0; }
details summary { cursor: pointer; font-weight: 500; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: var(--r); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) { h1 { font-size: 1.7rem; } .bar { grid-template-columns: 96px 1fr 58px; } .kpi .v { font-size: 1.7rem; } }
</style>

<script id="engine-src">
/* Silo Decision Lab - independent discrete-event simulation engine.
   Runs headless (Node, Web Worker or page). No FlexSim dependency.
   Time unit: minutes from midnight. Rates: tonnes per hour. Quantities: tonnes (float).
   Event tie-breaking: time, then class (0 release/completion, 1 control, 2 arrival), then insertion order. */
(function (root) {
  'use strict';
  const VERSION = '0.2.0';
  const EPS = 1e-6;

  // ---------- random streams ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash() {
    let h = 2166136261 >>> 0;
    for (let k = 0; k < arguments.length; k++) {
      const s = String(arguments[k]);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      h ^= 0x2f; h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function tri(u, p) {
    const a = +p[0], c = +p[1], b = +p[2];
    if (!(b > a)) return a;
    const F = (c - a) / (b - a);
    return u < F ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c));
  }
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ---------- event calendar ----------
  class Calendar {
    constructor() { this.a = []; this.seq = 0; }
    less(x, y) { return x.t < y.t || (x.t === y.t && (x.p < y.p || (x.p === y.p && x.s < y.s))); }
    push(t, p, fn, label) {
      const a = this.a; const e = { t, p, s: this.seq++, fn, label }; a.push(e);
      let i = a.length - 1;
      while (i > 0) { const j = (i - 1) >> 1; if (this.less(a[i], a[j])) { [a[i], a[j]] = [a[j], a[i]]; i = j; } else break; }
    }
    pop() {
      const a = this.a; if (!a.length) return null;
      const top = a[0]; const last = a.pop();
      if (a.length) {
        a[0] = last; let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1; let m = i;
          if (l < a.length && this.less(a[l], a[m])) m = l;
          if (r < a.length && this.less(a[r], a[m])) m = r;
          if (m === i) break; [a[i], a[m]] = [a[m], a[i]]; i = m;
        }
      }
      return top;
    }
    get size() { return this.a.length; }
  }

  // ---------- equipment library ----------
  const TYPES = {
    sampler: { label: 'Sampling point', group: 'truck' },
    grader: { label: 'Grading station', group: 'truck' },
    weighbridge: { label: 'Weighbridge', group: 'truck' },
    hopper: { label: 'Unloading hopper', group: 'grain' },
    conveyor: { label: 'Conveyor', group: 'grain' },
    elevator: { label: 'Bucket elevator', group: 'grain' },
    bin: { label: 'Storage bin', group: 'grain' },
    loadpoint: { label: 'Loading point', group: 'grain' }
  };
  const CONNECT = {
    hopper: ['conveyor', 'elevator'],
    conveyor: ['conveyor', 'elevator', 'bin', 'loadpoint'],
    elevator: ['conveyor', 'bin', 'loadpoint'],
    bin: ['conveyor', 'elevator', 'loadpoint'],
    loadpoint: [], sampler: [], grader: [], weighbridge: []
  };
  const MID = (t) => t === 'conveyor' || t === 'elevator';
  const STEP_LABEL = { sample: 'Sampling', grade: 'Grading', weigh_in: 'Weigh in', tip: 'Unloading', load: 'Loading', weigh_out: 'Weigh out' };
  const ACT_LABEL = { unload: 'Unloading', load: 'Loading', weigh: 'Weighbridge only' };

  // ---------- validation ----------
  function nameOf(cfg, id) { const e = cfg.equipment.find((x) => x.id === id); return e ? e.name : id; }
  function cName(cfg, c) { const x = (cfg.commodities || []).find((k) => k.id === c); return x ? x.name : c; }
  function listNames(arr) { return arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1]; }

  function buildRoutes(cfg) {
    const byId = {}; cfg.equipment.forEach((e) => { byId[e.id] = e; });
    const out = {}; cfg.equipment.forEach((e) => { out[e.id] = []; });
    (cfg.edges || []).forEach(([a, b]) => { if (out[a] && byId[b]) out[a].push(b); });
    const intake = {}, load = {};
    const LIMIT = 400;
    cfg.equipment.filter((e) => e.type === 'hopper').forEach((h) => {
      const paths = []; const stack = [[h.id, [h.id]]];
      while (stack.length && paths.length < LIMIT) {
        const [n, path] = stack.pop();
        for (const m of out[n]) {
          if (path.includes(m)) continue;
          const t = byId[m].type;
          if (t === 'bin') paths.push(path.concat(m));
          else if (MID(t)) stack.push([m, path.concat(m)]);
        }
      }
      paths.sort((a, b) => a.length - b.length || a.join().localeCompare(b.join()));
      intake[h.id] = paths;
    });
    cfg.equipment.filter((e) => e.type === 'bin').forEach((bn) => {
      const paths = []; const stack = [[bn.id, [bn.id]]];
      while (stack.length && paths.length < LIMIT) {
        const [n, path] = stack.pop();
        for (const m of out[n]) {
          if (path.includes(m)) continue;
          const t = byId[m].type;
          if (t === 'loadpoint') paths.push(path.concat(m));
          else if (MID(t)) stack.push([m, path.concat(m)]);
        }
      }
      paths.sort((a, b) => a.length - b.length || a.join().localeCompare(b.join()));
      load[bn.id] = paths;
    });
    return { intake, load, out, byId };
  }

  function validate(cfg) {
    const errors = [], warnings = [], info = [];
    const E = (msg, ids) => errors.push({ msg, ids: ids || [] });
    const W = (msg, ids) => warnings.push({ msg, ids: ids || [] });
    const eqs = cfg.equipment || [];
    const ids = new Set();
    eqs.forEach((e) => {
      if (ids.has(e.id)) E('Two items share the identifier ' + e.id + '. Each item needs its own identifier.', [e.id]);
      ids.add(e.id);
      if (!TYPES[e.type]) E(e.name + ' has an unsupported equipment type (' + e.type + ').', [e.id]);
    });
    const byId = {}; eqs.forEach((e) => { byId[e.id] = e; });
    const cids = new Set((cfg.commodities || []).map((c) => c.id));
    // edges
    const seen = new Set();
    (cfg.edges || []).forEach(([a, b]) => {
      if (!byId[a] || !byId[b]) { E('A connection refers to equipment that no longer exists (' + a + ' to ' + b + ').'); return; }
      const k = a + '>' + b;
      if (seen.has(k)) W('The connection from ' + byId[a].name + ' to ' + byId[b].name + ' is listed twice.', [a, b]);
      seen.add(k);
      if (!CONNECT[byId[a].type].includes(byId[b].type))
        E(byId[a].name + ' cannot feed ' + byId[b].name + '. A ' + TYPES[byId[a].type].label.toLowerCase() + ' cannot discharge into a ' + TYPES[byId[b].type].label.toLowerCase() + '.', [a, b]);
    });
    // capacities
    eqs.forEach((e) => {
      if (['sampler', 'grader', 'weighbridge'].includes(e.type)) {
        if (!(e.cap >= 1)) E(e.name + ' needs a capacity of at least 1 truck at a time.', [e.id]);
        if (!e.time || !(e.time[2] > 0)) E(e.name + ' needs a processing time.', [e.id]);
      }
      if (e.type === 'hopper') {
        if (!(e.capT > 0)) E(e.name + ' needs a pit capacity in tonnes.', [e.id]);
        if (!(e.rate > 0)) E(e.name + ' needs a discharge rate in t/h.', [e.id]);
        (e.commodities || []).forEach((c) => { if (!cids.has(c)) E(e.name + ' is assigned to an unknown commodity (' + c + ').', [e.id]); });
        if (!(e.commodities || []).length) W(e.name + ' accepts no commodity, so no truck will use it.', [e.id]);
      }
      if (MID(e.type) && !(e.rate > 0)) E(e.name + ' needs a transfer rate in t/h.', [e.id]);
      if (e.type === 'loadpoint' && !(e.rate > 0)) E(e.name + ' needs a loading rate in t/h.', [e.id]);
      if (e.type === 'bin') {
        if (!(e.capT > 0)) E(e.name + ' needs a capacity in tonnes.', [e.id]);
        if ((e.inv || 0) > (e.capT || 0) + EPS) E(e.name + ' holds ' + e.inv + ' t at the start, more than its ' + e.capT + ' t capacity.', [e.id]);
        if ((e.inv || 0) > 0 && !(e.commodities || []).includes(e.invCommodity))
          E(e.name + ' starts with ' + cName(cfg, e.invCommodity) + ', which the bin is not allowed to store.', [e.id]);
      }
    });
    const R = buildRoutes(cfg);
    // cycles among transfer equipment (bins break a cycle legitimately)
    const mids = eqs.filter((e) => MID(e.type) || e.type === 'hopper').map((e) => e.id);
    const color = {}; let cycleAt = null;
    const dfs = (n) => {
      color[n] = 1;
      for (const m of R.out[n] || []) {
        if (!byId[m] || !(MID(byId[m].type))) continue;
        if (color[m] === 1) { cycleAt = cycleAt || [n, m]; continue; }
        if (!color[m]) dfs(m);
      }
      color[n] = 2;
    };
    mids.forEach((n) => { if (!color[n]) dfs(n); });
    if (cycleAt) E('Grain could circulate in a loop between ' + byId[cycleAt[0]].name + ' and ' + byId[cycleAt[1]].name + '. Remove one of the connections in that loop.', cycleAt);

    // truck sequences
    const seqs = cfg.sequences || {};
    const has = (t, pred) => eqs.some((e) => e.type === t && (!pred || pred(e)));
    const dem = cfg.demand || {};
    Object.keys(ACT_LABEL).forEach((act) => {
      const d = dem[act]; if (!d || !(d.daily > 0)) return;
      const s = seqs[act] || [];
      if (!s.length) E(ACT_LABEL[act] + ' trucks have no activity sequence.');
      s.forEach((st, i) => {
        if (st === 'sample' && !has('sampler')) E(ACT_LABEL[act] + ' trucks need a sampling point, but none is configured.');
        if (st === 'grade') {
          if (!has('grader')) E(ACT_LABEL[act] + ' trucks need a grading station, but none is configured.');
          if (s.indexOf('sample') < 0 || s.indexOf('sample') > i) E(ACT_LABEL[act] + ' trucks are graded before a sample is taken. Put Sampling before Grading.');
        }
        if (st === 'weigh_in' && !has('weighbridge', (e) => e.moves !== 'out')) E(ACT_LABEL[act] + ' trucks need a weighbridge that weighs in.');
        if (st === 'weigh_out' && !has('weighbridge', (e) => e.moves !== 'in')) E(ACT_LABEL[act] + ' trucks need a weighbridge that weighs out.');
        if (st === 'tip' && act !== 'unload') E('Only unloading trucks can tip into a hopper.');
        if (st === 'load' && act !== 'load') E('Only loading trucks can be loaded.');
      });
      if (act === 'unload' && !s.includes('tip')) E('Unloading trucks never reach a hopper. Add Unloading to their sequence.');
      if (act === 'load' && !s.includes('load')) E('Loading trucks never reach a loading point. Add Loading to their sequence.');
    });

    // hopper reachability and commodity routing
    const hoppers = eqs.filter((e) => e.type === 'hopper');
    const bins = eqs.filter((e) => e.type === 'bin');
    hoppers.forEach((h) => {
      const paths = R.intake[h.id] || [];
      if (!(R.out[h.id] || []).length) { E(h.name + ' is not connected to any conveyor or elevator, so grain tipped there cannot leave the pit.', [h.id]); return; }
      if (!paths.length) { E(h.name + ' has no complete route to a storage bin. Follow its conveyors and elevators and connect the last one to a bin.', [h.id]); return; }
      const reach = [...new Set(paths.map((p) => p[p.length - 1]))];
      (h.commodities || []).forEach((c) => {
        const ok = reach.some((b) => (byId[b].commodities || []).includes(c));
        if (ok) return;
        const accepting = bins.filter((b) => (b.commodities || []).includes(c)).map((b) => b.name);
        const lastHops = [...new Set(paths.map((p) => byId[p[p.length - 2]].name))];
        if (!accepting.length) E(h.name + ' accepts ' + cName(cfg, c) + ', but no storage bin is allowed to hold ' + cName(cfg, c) + '.', [h.id]);
        else E(h.name + ' cannot deliver ' + cName(cfg, c) + ' to any eligible storage bin because ' + listNames(lastHops) + ' ' + (lastHops.length > 1 ? 'are' : 'is') + ' not connected to ' + listNames(accepting) + '.', [h.id]);
      });
    });
    bins.forEach((b) => {
      const reachedBy = hoppers.filter((h) => (R.intake[h.id] || []).some((p) => p[p.length - 1] === b.id));
      if (!reachedBy.length) W(b.name + ' cannot receive grain from any hopper.', [b.id]);
    });
    // commodity demand coverage
    const un = dem.unload;
    if (un && un.daily > 0) {
      const mix = un.mix || {}; const tot = Object.values(mix).reduce((a, b) => a + (+b || 0), 0);
      if (Math.abs(tot - 1) > 0.01) W('The unloading commodity mix adds up to ' + Math.round(tot * 100) + '%. It will be scaled to 100%.');
      Object.keys(mix).forEach((c) => {
        if (!(mix[c] > 0)) return;
        if (!cids.has(c)) { E('Unloading demand includes an unknown commodity (' + c + ').'); return; }
        const hs = hoppers.filter((h) => (h.commodities || []).includes(c));
        if (!hs.length) E(cName(cfg, c) + ' trucks arrive, but no hopper accepts ' + cName(cfg, c) + '.');
      });
      if (!(un.payload && un.payload[2] > 0)) E('Unloading trucks need a payload range in tonnes.');
      const maxHopper = Math.max(0, ...hoppers.map((h) => h.capT || 0));
      if (un.payload && un.payload[2] > maxHopper + EPS) E('The largest unloading payload (' + un.payload[2] + ' t) exceeds every hopper capacity (largest ' + maxHopper + ' t).');
    }
    const ld = dem.load;
    if (ld && ld.daily > 0) {
      const mix = ld.mix || {};
      Object.keys(mix).forEach((c) => {
        if (!(mix[c] > 0)) return;
        const bs = bins.filter((b) => (b.commodities || []).includes(c));
        const feasible = bs.filter((b) => (R.load[b.id] || []).length);
        if (!bs.length) E('Loading trucks collect ' + cName(cfg, c) + ', but no bin stores it.');
        else if (!feasible.length) E('Loading trucks collect ' + cName(cfg, c) + ', but no bin holding it is connected to a loading point.');
        else {
          const stock = feasible.reduce((a, b) => a + (b.invCommodity === c ? (b.inv || 0) : 0), 0);
          const fedByIntake = un && un.daily > 0 && (un.mix || {})[c] > 0;
          if (stock < (ld.payload ? ld.payload[2] : 30) && !fedByIntake) E('Loading trucks collect ' + cName(cfg, c) + ', but there is no opening stock and no intake of it.');
          else if (stock < (ld.payload ? ld.payload[2] : 30)) W('There is little opening stock of ' + cName(cfg, c) + '. Early loading trucks will wait for intake.');
        }
      });
    }
    // shared equipment
    const users = {};
    hoppers.forEach((h) => (R.intake[h.id] || []).forEach((p) => p.slice(1, -1).forEach((m) => { (users[m] = users[m] || new Set()).add(h.name); })));
    bins.forEach((b) => (R.load[b.id] || []).forEach((p) => p.slice(1, -1).forEach((m) => { (users[m] = users[m] || new Set()).add('loading'); })));
    const shared = Object.keys(users).filter((k) => users[k].size > 1);
    shared.forEach((k) => info.push({ msg: byId[k].name + ' is shared by ' + listNames([...users[k]]) + '. Only one grain stream can use it at a time.', ids: [k] }));
    const wbShared = eqs.filter((e) => e.type === 'weighbridge');
    const acts = Object.keys(ACT_LABEL).filter((a) => dem[a] && dem[a].daily > 0);
    if (wbShared.length && acts.length > 1) info.push({ msg: 'Weighbridge capacity is shared by ' + listNames(acts.map((a) => ACT_LABEL[a].toLowerCase())) + ' trucks.', ids: wbShared.map((e) => e.id) });
    const unreachable = bins.filter((b) => !hoppers.some((h) => (R.intake[h.id] || []).some((p) => p[p.length - 1] === b.id))).map((b) => b.id);
    return { ok: errors.length === 0, errors, warnings, info, routes: R, shared, users: Object.fromEntries(Object.entries(users).map(([k, v]) => [k, [...v]])), unreachable };
  }

  // ---------- simulation ----------
  function runReplication(cfg, opt) {
    opt = opt || {};
    const v = opt.validation || validate(cfg);
    if (!v.ok) throw new Error('Configuration is not valid: ' + v.errors[0].msg);
    const seed = (opt.seed >>> 0) || 1;
    const df = opt.demandFactor == null ? 1 : +opt.demandFactor;
    const warm = (opt.warmup || 0);
    const traceOn = !!opt.trace;
    const R = v.routes;
    const hrs = cfg.hours || { open: 6, close: 18, overtime: 3 };
    const T0 = hrs.open * 60, TC = hrs.close * 60, TEND = (hrs.close + (hrs.overtime || 0)) * 60;
    const pol = Object.assign({ tip: 'fifo', weigh: 'fifo', transfer: 'fifo' }, cfg.policies || {});
    const cal = new Calendar();
    let now = T0;
    const diag = []; const trace = [];
    const fail = (rule, msg, ents, res) => { if (diag.length < 200) diag.push({ t: now, rule, msg, entities: ents || [], resources: res || [] }); };
    const log = (msg) => { if (traceOn && trace.length < 3000) trace.push([now, msg]); };

    // state
    const S = {}; // equipment state
    cfg.equipment.forEach((e) => {
      S[e.id] = { e, busy: 0, area: 0, lastT: T0, last: null, level: 0, lots: [], hC: null, tipping: false, transferring: false,
        inv: e.type === 'bin' ? (e.inv || 0) : 0, invC: e.type === 'bin' && e.inv > 0 ? e.invCommodity : null,
        resIn: 0, resInC: null, resOut: 0, waitArea: 0, waitLast: T0, waiting: false, changeovers: 0, transfers: 0, tons: 0 };
      if (e.type === 'hopper' && e.level0 > 0) {
        S[e.id].level = e.level0; S[e.id].hC = e.levelCommodity;
        S[e.id].lots.push({ id: 'L0-' + e.id, truck: null, c: e.levelCommodity, rem: e.level0, qty: e.level0, t: T0 });
      }
    });
    const eqOf = (t) => cfg.equipment.filter((e) => e.type === t);
    const setBusy = (id, d) => { const s = S[id]; s.area += s.busy * (now - s.lastT); s.lastT = now; s.busy += d;
      const cap = s.e.cap || 1; if (s.busy > cap + EPS || s.busy < -EPS) fail('double-allocation', s.e.name + ' was allocated beyond its capacity (' + s.busy + ' of ' + cap + ').', [], [id]); };
    const setWaiting = (id, w) => { const s = S[id]; if (s.waiting) s.waitArea += now - s.waitLast; s.waitLast = now; s.waiting = w; };
    let opening = 0; cfg.equipment.forEach((e) => { opening += S[e.id].inv + S[e.id].level; });
    let received = 0, dispatched = 0, stored = 0;

    // units for pooled truck resources
    const units = { sample: [], grade: [], weigh: [] };
    eqOf('sampler').forEach((e) => { for (let k = 0; k < e.cap; k++) units.sample.push({ id: e.id, k, busy: false }); });
    eqOf('grader').forEach((e) => { for (let k = 0; k < e.cap; k++) units.grade.push({ id: e.id, k, busy: false }); });
    eqOf('weighbridge').forEach((e) => { for (let k = 0; k < e.cap; k++) units.weigh.push({ id: e.id, k, busy: false, moves: e.moves || 'both' }); });

    // queues with time-weighted stats
    const Q = {};
    ['sample', 'grade', 'weigh', 'tip', 'load'].forEach((k) => { Q[k] = { items: [], area: 0, last: T0, max: 0 }; });
    const qTouch = (k) => { const q = Q[k]; q.area += q.items.length * (now - q.last); q.last = now; };
    const qPush = (k, x) => { qTouch(k); Q[k].items.push(x); Q[k].max = Math.max(Q[k].max, Q[k].items.length); };
    const qTake = (k, i) => { qTouch(k); return Q[k].items.splice(i, 1)[0]; };

    // trucks
    const trucks = {}; const present = new Set();
    const done = []; const rejected = [];
    const gradeResults = {}; // sampleId -> {reject}
    const awaiting = {}; // truckId -> sampleId
    const transfersLog = {}; const lotsDone = [];
    let tCount = 0;
    const commodityPick = (mix, u) => {
      const ks = Object.keys(mix).filter((k) => mix[k] > 0); const tot = ks.reduce((a, k) => a + +mix[k], 0);
      let acc = 0; for (const k of ks) { acc += mix[k] / tot; if (u < acc) return k; } return ks[ks.length - 1];
    };
    function makeTruck(act, idx, arr, backlog) {
      const r = mulberry32(hash(seed, act, idx, backlog ? 'b' : 'a'));
      const d = cfg.demand[act];
      const tr = { id: (act === 'unload' ? 'U' : act === 'load' ? 'L' : 'W') + (backlog ? 'B' : '') + idx, act, arr, steps: (cfg.sequences[act] || []).slice(), si: -1,
        u: {}, waits: {}, svc: {}, qIn: 0, c: null, qty: 0, grade: null, backlog: !!backlog };
      const u1 = r(), u2 = r();
      if (act !== 'weigh') { tr.c = commodityPick(d.mix || {}, u1); tr.qty = Math.round(tri(u2, d.payload) * 100) / 100; }
      tr.grade = act === 'unload' ? (r() < 0.85 ? 'Grade 1' : 'Grade 2') : null;
      ['sample', 'grade', 'weigh_in', 'tip', 'load', 'weigh_out', 'reject', 'setup'].forEach((k) => { tr.u[k] = r(); });
      tCount++;
      return tr;
    }
    function arrive(tr) {
      trucks[tr.id] = tr; present.add(tr.id); log(tr.id + ' arrives (' + ACT_LABEL[tr.act] + (tr.c ? ', ' + cName(cfg, tr.c) + ' ' + tr.qty + ' t' : '') + ')');
      advance(tr);
    }
    function depart(tr, rej) {
      tr.dep = now; present.delete(tr.id);
      // completion invariant
      if (!rej && tr.si !== tr.steps.length) fail('truck-completion', tr.id + ' left before completing its activity sequence.', [tr.id]);
      (rej ? rejected : done).push(tr); log(tr.id + (rej ? ' rejected and leaves' : ' departs'));
    }
    function advance(tr) {
      tr.si++;
      if (tr.si >= tr.steps.length) { depart(tr, false); return; }
      const st = tr.steps[tr.si]; tr.qIn = now; tr.cur = st;
      if (st === 'sample') { qPush('sample', tr); dispatchPool('sample'); }
      else if (st === 'grade') {
        const sid = 'S' + tr.id;
        if (gradeResults[sid]) { finishGradeWait(tr, gradeResults[sid]); }
        else awaiting[tr.id] = sid;
      }
      else if (st === 'weigh_in' || st === 'weigh_out') { tr.dir = st === 'weigh_in' ? 'in' : 'out'; qPush('weigh', tr); dispatchPool('weigh'); }
      else if (st === 'tip') { qPush('tip', tr); dispatchTip(); }
      else if (st === 'load') { qPush('load', tr); dispatchTransfers(); }
    }
    function finishGradeWait(tr, res) {
      tr.waits.grade = (tr.waits.grade || 0) + (now - tr.qIn);
      delete awaiting[tr.id];
      if (res.reject) { depart(tr, true); return; }
      tr.gradedAs = res.grade; advance(tr);
    }

    // pooled resources: samplers, graders (samples), weighbridges
    function unitFits(kind, unit, item) {
      if (unit.busy) return false;
      if (kind === 'weigh') return unit.moves === 'both' || unit.moves === item.dir;
      return true;
    }
    function weighOrder(items) {
      const idx = items.map((x, i) => i);
      if (pol.weigh === 'load_first') idx.sort((a, b) => (items[a].act === 'load' ? 0 : 1) - (items[b].act === 'load' ? 0 : 1) || a - b);
      else if (pol.weigh === 'out_first') idx.sort((a, b) => (items[a].dir === 'out' ? 0 : 1) - (items[b].dir === 'out' ? 0 : 1) || a - b);
      return idx;
    }
    function dispatchPool(kind) {
      let progress = true;
      while (progress) {
        progress = false;
        const items = Q[kind].items;
        const order = kind === 'weigh' ? weighOrder(items) : items.map((x, i) => i);
        for (const i of order) {
          const item = items[i];
          const unit = units[kind].find((u) => unitFits(kind, u, item));
          if (unit) { qTake(kind, i); startPool(kind, item, unit); progress = true; break; }
        }
      }
    }
    function startPool(kind, item, unit) {
      unit.busy = true; setBusy(unit.id, 1);
      const e = S[unit.id].e;
      let dur;
      if (kind === 'grade') { dur = tri(item.u, e.time); item.wait = now - item.qIn; }
      else {
        const key = kind === 'weigh' ? (item.dir === 'in' ? 'weigh_in' : 'weigh_out') : 'sample';
        dur = tri(item.u[key], e.time); item.waits[key] = (item.waits[key] || 0) + (now - item.qIn); item.svc[key] = dur;
        if (key === 'weigh_in') item.wbIn = now;
      }
      log((kind === 'grade' ? 'Sample ' + item.id : item.id) + ' starts ' + (kind === 'grade' ? 'grading' : kind === 'weigh' ? (item.dir === 'in' ? 'weigh-in' : 'weigh-out') : 'sampling') + ' at ' + e.name);
      cal.push(now + dur, 0, () => {
        unit.busy = false; setBusy(unit.id, -1);
        if (kind === 'sample') {
          const smp = { id: 'S' + item.id, truckId: item.id, qIn: now, u: item.u.grade, reject: item.u.reject };
          qPush('grade', smp); dispatchPool('grade');
          advance(item);
          dispatchPool('sample');
        } else if (kind === 'grade') {
          const g = S[unit.id].e;
          const res = { reject: item.reject < (g.reject || 0), grade: trucks[item.truckId] ? trucks[item.truckId].grade : null };
          const tr = trucks[item.truckId];
          if (!tr) { fail('sample-match', 'Sample ' + item.id + ' has no matching truck.', [item.id]); }

// ---------------- validation against history (FR-020) ----------------
function evaluateValidation(st) {

    const rel = Math.abs(simCi.mean - obs) / obs;

  };
  const s = b.summary.kpi;
  add('Weigh-in to weigh-out time, unloading', d.targets.wbio, s.wbio, 'min', 0.15);
  const upd = E.ci(b.reps.map((r) => r.trucks.departed.unload));
  add('Unloading trucks completed per day', d.targets.unloadPerDay, upd, 'trucks', 0.1);
  const tpd = E.ci(b.reps.map((r) => r.grain.received));
  add('Tonnes received per day', d.targets.tonnesPerDay, tpd, 't', 0.1);
  st.validation = { ts: Date.now(), cfgVersion: st.cfg.version, tests, pass: tests.length > 0 && tests.every((t) => t.pass) && b.summary.violations === 0, dataVersion: d.version };

// ---------------- network layout ----------------
function layout(cfg) {
  const byId = {}; cfg.equipment.forEach((e) => { byId[e.id] = e; });
  const g = cfg.equipment.filter((e) => E.TYPES[e.type] && E.TYPES[e.type].group === 'grain');
  const mid = (t) => t === 'conveyor' || t === 'elevator';
  const L = {};
  g.filter((e) => e.type === 'hopper').forEach((e) => { L[e.id] = 0; });
  for (let it = 0; it < g.length + 2; it++) {
    cfg.edges.forEach(([a, b]) => {
      if (!byId[a] || !byId[b]) return;
      if (L[a] != null && byId[a].type !== 'bin' && mid(byId[b].type) && (L[b] == null || L[b] < L[a] + 1) && L[a] + 1 < 12) L[b] = L[a] + 1;
    });
  }
  const midMax = Math.max(0, ...Object.keys(L).map((k) => L[k]));
  const binL = midMax + 1;
  g.filter((e) => e.type === 'bin').forEach((e) => { L[e.id] = binL; });
  for (let it = 0; it < g.length + 2; it++) {
    cfg.edges.forEach(([a, b]) => {
      if (!byId[a] || !byId[b]) return;
      if (L[a] != null && L[b] == null && mid(byId[b].type) && L[a] >= binL) L[b] = L[a] + 1;
    });
  }
  g.filter((e) => mid(e.type) && L[e.id] == null).forEach((e) => { L[e.id] = binL + 1; });
  const maxL = Math.max(0, ...Object.values(L));
  g.filter((e) => e.type === 'loadpoint').forEach((e) => { L[e.id] = maxL + 1; });
  const cols = {}; g.forEach((e) => { (cols[L[e.id]] = cols[L[e.id]] || []).push(e.id); });
  const W = 132, H = 42, CX = 176, RY = 60, PAD = 24;
  const pos = {}; let maxRows = 0;
  Object.keys(cols).forEach((c) => { maxRows = Math.max(maxRows, cols[c].length); });
  Object.keys(cols).forEach((c) => {
    const n = cols[c].length; const off = (maxRows - n) * RY / 2;
    cols[c].forEach((id, i) => { pos[id] = { x: PAD + c * CX, y: PAD + 18 + off + i * RY }; });
  });
  const width = PAD * 2 + (Math.max(0, ...Object.keys(cols).map(Number)) * CX) + W;
  const height = PAD * 2 + 18 + maxRows * RY + 40;
  return { pos, W, H, width, height, cols, L, binL };
}
const TYPE_TAG = { hopper: 'HOPPER', conveyor: 'CONVEYOR', elevator: 'ELEVATOR', bin: 'BIN', loadpoint: 'LOAD-OUT' };
function networkSvg(cfg, v, opt) {
  const lay = layout(cfg); const { pos, W, H } = lay; const z = S.zoom || 1;
  const sel = opt.sel; const hop = opt.routeFor;
  const onNodes = new Set(); const onEdges = new Set();
  if (hop && v.routes.intake[hop]) v.routes.intake[hop].forEach((p) => { p.forEach((n) => onNodes.add(n)); for (let i = 0; i < p.length - 1; i++) onEdges.add(p[i] + '>' + p[i + 1]); });
  if (hop && v.routes.load[hop]) v.routes.load[hop].forEach((p) => { p.forEach((n) => onNodes.add(n)); for (let i = 0; i < p.length - 1; i++) onEdges.add(p[i] + '>' + p[i + 1]); });
  const errIds = new Set(); v.errors.forEach((e) => (e.ids || []).forEach((i) => errIds.add(i)));
  let s = '<svg viewBox="0 0 ' + lay.width + ' ' + lay.height + '" width="' + Math.round(lay.width * z) + '" height="' + Math.round(lay.height * z) + '" role="img" aria-label="Grain transfer network for ' + esc(cfg.name) + '">';
  s += '<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--muted)"/></marker>' +
    '<marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" style="fill:var(--maize)"/></marker></defs>';
  // column captions
  const caps = {}; Object.keys(lay.cols).forEach((c) => {
    const types = [...new Set(lay.cols[c].map((id) => cfg.equipment.find((e) => e.id === id).type))];
    caps[c] = types.includes('bin') ? 'Storage' : types.includes('hopper') ? 'Intake pits' : types.includes('loadpoint') ? 'Dispatch' : (+c > lay.binL ? 'Reclaim' : 'Transfer');
  });

  cfg.edges.forEach(([a, b]) => {

    let d, back = false;
    if (pb.x > pa.x) { const x1 = pa.x + W, y1 = pa.y + H / 2, x2 = pb.x - 2, y2 = pb.y + H / 2, mx = (x1 + x2) / 2; d = 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2; }
    else { back = true; const x1 = pa.x + W / 2, y1 = pa.y + H, x2 = pb.x + W / 2, y2 = pb.y + H + 2; const low = Math.max(y1, y2) + 46; d = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + low + ' ' + x2 + ' ' + low + ' ' + x2 + ' ' + y2; }
    s += '<path class="edge' + (on ? ' on' : '') + (back ? ' back' : '') + '" d="' + d + '" marker-end="url(#' + (on ? 'ah2' : 'ah') + ')"/>';
  });

    const cls = ['node']; if (sel === e.id) cls.push('sel'); if (onNodes.has(e.id)) cls.push('on');
    if (v.shared.includes(e.id)) cls.push('shared'); if (v.unreachable.includes(e.id)) cls.push('unreach'); if (errIds.has(e.id)) cls.push('err');
    let sub = TYPE_TAG[e.type];
    if (e.type === 'bin') sub += ' · ' + fmt(e.capT) + ' t';

    const name = e.name.length > 17 ? e.name.slice(0, 16) + '…' : e.name;
    s += '<g class="' + cls.join(' ') + '" data-act="sel-node" data-id="' + esc(e.id) + '" tabindex="0" role="button" aria-label="' + esc(e.name) + '">' +
      '<rect x="' + p.x + '" y="' + p.y + '" width="' + W + '" height="' + H + '" rx="4"/>';
    if (e.type === 'bin' || e.type === 'hopper') {
      const cs = e.commodities || []; cs.forEach((c, i) => { const col = (cfg.commodities.find((k) => k.id === c) || {}).color || '#888'; s += '<rect x="' + (p.x + 4 + i * 9) + '" y="' + (p.y + H - 7) + '" width="7" height="3" rx="1" style="fill:' + esc(col) + ';stroke:none"/>'; });
    }
    s += '<text x="' + (p.x + 8) + '" y="' + (p.y + 17) + '">' + esc(name) + '</text><text class="ty" x="' + (p.x + 8) + '" y="' + (p.y + 31) + '">' + esc(sub) + '</text></g>';
  });
  return s + '</svg>';
}

function constraintVerdicts(st) {

    const name = ids.length > 1 ? E.TYPES[cfg.equipment.find((e) => e.id === ids[0]).type].label + 's' : eqName(cfg, ids[0]);
    const stepFor = { weighbridge: ['weigh_in', 'weigh_out'], sampler: ['sample'], grader: ['grade'], hopper: ['tip'] }[r.key] || ['tip'];
    const wait = stepFor.reduce((a, k) => a + ((c.baseWaits[k] || {}).mean || 0), 0);

    return { name, label: r.label, u, wait, dTat: r.dTat, dStored: r.dStored, verdict };
  }).sort((a, b) => a.dTat.mean - b.dTat.mean).map((r, i, arr) => {

    return r;
  });
}

function runScenario() {

      summaries: Object.fromEntries(Object.keys(res).map((k) => [k, res[k].summary])), diffs, utilShift, refKey: !cfgChange ? 'A' : f !== 1 ? 'B' : 'A', altKey: cfgChange ? 'C' : 'B',

function scenarioResult(st, x) {

    '<p>Grain into storage changes by <b>' + (d.stored.mean >= 0 ? '+' : '') + fmt(d.stored.mean) + ' t per day</b>' + (d.stored.significant ? '.' : ', which is within noise.') + '</p>' +

// ----- decision -----
function finOf(st, x) {

  const wait = F.includeWait ? (-dTat / 60) * unloadTrucks * F.seasonDays * F.waitCost : 0;
  const won = (x.fin.extraT || 0) * F.margin;

  const r = F.discount / 100; let npv = -capex; for (let y = 1; y <= F.years; y++) npv += net / Math.pow(1 + r, y);

}

// ---------------- events ----------------
function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function afterRender() {
  const net = $('#net');
  if (net) {
    let sx, sy, dx, dy, down = false, moved = false;
    net.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = net.scrollLeft; dy = net.scrollTop; });
    net.addEventListener('pointermove', (e) => { if (!down) return; const mx = e.clientX - sx, my = e.clientY - sy; if (Math.abs(mx) + Math.abs(my) > 4) { moved = true; net.classList.add('drag'); } net.scrollLeft = dx - mx; net.scrollTop = dy - my; });
    const up = () => { down = false; net.classList.remove('drag'); };
    net.addEventListener('pointerup', up); net.addEventListener('pointerleave', up);
    net.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    net.addEventListener('keydown', (e) => { const g = e.target.closest('[data-act="sel-node"]'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  }
  const f = $('#csvfile');
  if (f) f.addEventListener('change', () => {
    const file = f.files[0]; if (!file) return;
    const rd = new FileReader(); rd.onload = () => { loadImport(file.name, String(rd.result)); }; rd.readAsText(file);
  });
}
function loadImport(name, text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('The file has no data rows.'); return; }
  importState = { siteId: S.siteId, name, rows, map: guessMap(rows[0]), prep: null };
  render();
}
const ACTIONS = {
  tab(d) { S.tab = d.v; render(); window.scrollTo(0, 0); },
  sub(d) { S.sub = d.v; render(); },
  mode(d) { S.mode = d.v; render(); },
  'pick-site'(d) { S.siteId = d.v; S.sel = null; render(); },
  'run-baseline'() { runBaseline(); },
  'run-constraint'() { if (!site().baseline) { toast('Run the baseline first.'); return; } runConstraint(); },
  'cancel-job'() { cancelJob(); },
  'close-job'() { job = null; renderDock(); },
  discard() { const st = site(); st.draft = E.clone(st.cfg); render(); toast('Changes discarded.'); },
  'save-version'() {
    const st = site(); const note = ($('#vnote') || {}).value || 'Configuration updated';
    const changes = diffSummary(st.cfg, st.draft);
    st.draft.version = st.cfg.version + 1; st.cfg = E.clone(st.draft);
    st.versions.push({ v: st.cfg.version, ts: Date.now(), note, cfg: E.clone(st.cfg) });
    if (st.versions.length > 30) st.versions.splice(1, 1);
    audit(st, 'Saved version ' + st.cfg.version + ': ' + note + ' (' + changes.join('; ') + ')');
    if (st.validation) st.validation.cfgVersion = st.validation.cfgVersion; // kept, marked stale by version check
    render(); toast('Saved as version ' + st.cfg.version + '.');
  },
  'add-eq'(d) {
    const st = site(); const t = d.v; const pref = { sampler: 'S', grader: 'G', weighbridge: 'WB', hopper: 'H', conveyor: 'C', elevator: 'E', bin: 'B', loadpoint: 'L' }[t];
    const id = E.nextId(st.draft, pref); const n = st.draft.equipment.filter((e) => e.type === t).length + 1;
    const tmpl = { sampler: { cap: 1, time: [1.5, 2.5, 4] }, grader: { cap: 1, time: [4, 6, 10], reject: 0.02 }, weighbridge: { cap: 1, time: [1.5, 2, 3], moves: 'both' }, hopper: { capT: 60, rate: 400, tip: [4, 6, 9], commodities: [] },
      conveyor: { rate: 300, changeover: 6 }, elevator: { rate: 200, changeover: 8 }, bin: { capT: 4000, commodities: [], inv: 0 }, loadpoint: { rate: 250, setup: [3, 5, 8] } }[t];
    st.draft.equipment.push(Object.assign({ id, type: t, name: E.TYPES[t].label + ' ' + n }, tmpl)); S.sel = id; render(); toast(E.TYPES[t].label + ' added. Connect it under Connections.');
  },
  'dup-eq'(d) { const st = site(); const e = st.draft.equipment.find((x) => x.id === d.v); const id = E.nextId(st.draft, e.id.replace(/\d+$/, '')); st.draft.equipment.push(Object.assign(E.clone(e), { id, name: e.name + ' copy', inv: 0, level0: 0 })); S.sel = id; render(); },
  'del-eq'(d) { const st = site(); st.draft.equipment = st.draft.equipment.filter((x) => x.id !== d.v); st.draft.edges = st.draft.edges.filter(([a, b]) => a !== d.v && b !== d.v); if (S.sel === d.v) S.sel = null; render(); },
  'goto-node'(d) { S.sel = d.v; S.sub = 'network'; render(); },
  'toggle-c'(d, el) { const st = site(); const e = st.draft.equipment[+d.i]; e.commodities = e.commodities || []; if (el.checked) { if (!e.commodities.includes(d.c)) e.commodities.push(d.c); } else e.commodities = e.commodities.filter((c) => c !== d.c); render(); },
  'sel-node'(d) { S.sel = d.id || null; render(); },
  'toggle-edge'(d, el) { const st = site(); if (el.checked) st.draft.edges.push([d.a, d.b]); else st.draft.edges = st.draft.edges.filter(([a, b]) => !(a === d.a && b === d.b)); render(); },
  zoom(d) { const v = +d.v; S.zoom = v === 0 ? 1 : Math.max(0.5, Math.min(2, (S.zoom || 1) + v * 0.15)); render(); },
  'seq-up'(d) { const s = site().draft.sequences[d.a]; const i = +d.i; if (i > 0) [s[i - 1], s[i]] = [s[i], s[i - 1]]; render(); },
  'seq-del'(d) { site().draft.sequences[d.a].splice(+d.i, 1); render(); },
  'seq-add'(d) { const sel = $('#seqadd-' + d.a); if (sel && sel.value) { site().draft.sequences[d.a].push(sel.value); render(); } },
  'add-c'() { const id = ($('#newc-id').value || '').trim().toUpperCase(); const name = ($('#newc-name').value || '').trim(); const d = site().draft; if (!id || !name) { toast('Enter a code and a name.'); return; } if (d.commodities.some((c) => c.id === id)) { toast('That code is already in use.'); return; } d.commodities.push({ id, name, color: '#7a8a8f' }); render(); },
  q(d) { S.q = d.v; render(); },
  'run-scenario'() { runScenario(); },
  'show-scn'(d) { const st = site(); const i = st.scenarios.findIndex((x) => x.id === d.v); if (i > 0) { const [x] = st.scenarios.splice(i, 1); st.scenarios.unshift(x); render(); window.scrollTo(0, 0); } },
  'del-scn'(d) { const st = site(); st.scenarios = st.scenarios.filter((x) => x.id !== d.v); render(); },
  'example-data'() { loadImport('example-weighbridge-export.csv (illustrative)', exampleExport(site().cfg)); importState.illustrative = true; },
  'prep-data'() { importState.prep = prepareData(importState.rows, importState.map, site().draft); render(); },
  'apply-data'() { applyData(true); },
  'targets-only'() { applyData(false); },
  'copy-report'() { copyText(reportText(site()), 'Decision report copied.'); },
  'copy-json'() { copyText(JSON.stringify(site().cfg, null, 2), 'Configuration copied.'); },
  'run-tests'() { startJob({ cmd: 'tests', title: 'Acceptance and regression tests', onDone(res) { testResults = res; audit(site(), 'Regression suite: ' + res.filter((t) => t.pass).length + ' of ' + res.length + ' passed'); } }); },
  restore(d) { const st = site(); const v = st.versions.find((x) => x.v === +d.v); if (v) { st.draft = E.clone(v.cfg); st.draft.version = st.cfg.version; S.tab = 'config'; S.sub = 'check'; render(); toast('Version ' + d.v + ' loaded as a draft. Save it to make it current.'); } },
  'dup-site'() { const st = site(); const c = E.clone(st.cfg); c.id = 'site-' + uid(); c.name = st.cfg.name + ' (copy)'; c.version = 1; S.sites[c.id] = newSite(c, 'Duplicated from ' + st.cfg.name); S.order.push(c.id); S.siteId = c.id; render(); toast('Facility duplicated.'); },
  'new-site'() { newBlankSite(); },
  'archive-site'() { const st = site(); const live = S.order.filter((id) => !S.sites[id].archived); if (live.length < 2) { toast('Keep at least one active facility.'); return; } st.archived = true; audit(st, 'Facility archived'); S.siteId = live.find((id) => id !== S.siteId); render(); toast(st.cfg.name + ' archived.'); },
  reset() { S.confirmReset = true; render(); },
  'reset-no'() { S.confirmReset = false; render(); },
  'reset-yes'() { try { localStorage.removeItem(KEY); } catch (e) {} S = initState(); job = null; renderDock(); render(); toast('Prototype reset.'); }
};
function newBlankSite() {
  const c = { id: 'site-' + uid(), name: 'New facility', customer: site().cfg.customer, region: '', version: 1, hours: { open: 6, close: 18, overtime: 3 },
    commodities: E.clone(site().cfg.commodities), equipment: [], edges: [], sequences: { unload: ['sample', 'grade', 'weigh_in', 'tip', 'weigh_out'], load: ['weigh_in', 'load', 'weigh_out'], weigh: ['weigh_in'] },
    demand: { unload: { daily: 60, profile: E.samples.siteA().demand.unload.profile, payload: [24, 32.5, 38], mix: { YM: 1 } }, load: { daily: 0, profile: new Array(24).fill(1), payload: [30, 34, 36], mix: {} }, weigh: { daily: 0, profile: new Array(24).fill(1) } },
    policies: { tip: 'feasible', weigh: 'fifo', transfer: 'fifo' }, initial: { queue: { unload: 0, load: 0, weigh: 0 } } };
  S.sites[c.id] = newSite(c, 'Created blank'); S.order.push(c.id); S.siteId = c.id; S.tab = 'config'; S.sub = 'equipment'; render(); toast('Blank facility created. Add equipment from the catalogue.');
}
function applyData(toDemand) {
  const st = site(); const P = importState.prep; if (!P) return;
  if (toDemand) {
    Object.keys(P.per).forEach((a) => {
      const x = P.per[a]; const dm = st.draft.demand[a] = st.draft.demand[a] || { profile: new Array(24).fill(0) };
      dm.daily = +x.perDay.toFixed(1); dm.profile = x.profile.slice();
      if (x.payload) dm.payload = x.payload.map((v) => +(+v).toFixed(1));
      if (Object.keys(x.mix).length) dm.mix = Object.assign({}, x.mix);
    });
    audit(st, 'Demand updated from imported data ' + P.version + ' (draft)');
  }
  const u = P.per.unload || {};
  st.data = { name: importState.name, illustrative: !!importState.illustrative, ts: Date.now(), version: P.version, kept: P.kept, days: P.days, rows: P.rowCount,
    targets: { wbio: u.durs ? u.durs.mean : null, unloadPerDay: u.perDay || null, tonnesPerDay: u.tonnesPerDay || null } };
  st.validation = null;
  if (!toDemand && st.baseline) evaluateValidation(st);
  audit(st, 'Validation targets set from ' + P.version);
  importState = null;
  if (toDemand) { S.tab = 'config'; S.sub = 'check'; toast('Demand updated in the draft. Save a version, then run the baseline.'); }
  else toast('Validation targets set. Run the baseline to compare.');
  render();
}
function copyText(t, ok) {
  const done = () => toast(ok);
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, ok)); } catch (e) { fallbackCopy(t, ok); }
}
function fallbackCopy(t, ok) {
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  let s = false; try { s = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(s ? ok : 'Copy is blocked here. Select the text manually.');
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.tagName === 'INPUT' && a.type === 'checkbox') return; // handled on change
  const f = ACTIONS[a.dataset.act]; if (f) { e.preventDefault(); f(a.dataset, a, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target; const st = site();
  if (el.id === 'sitepick') { if (el.value === '__new') newBlankSite(); else { S.siteId = el.value; S.sel = null; render(); } return; }
  if (el.dataset.act && el.type === 'checkbox') { ACTIONS[el.dataset.act](el.dataset, el); return; }
  if (el.dataset.path) {
    let v = el.value;
    if (el.dataset.type !== 'str') { v = el.value === '' ? null : Number(el.value); if (el.value !== '' && !isFinite(v)) { toast('Enter a number.'); return; } }
    else if (v === '' && /invCommodity|levelCommodity/.test(el.dataset.path)) v = null;
    setPath(st.draft, el.dataset.path, v); render(); return;
  }
  const ch = el.dataset.ch; if (!ch) return;
  if (ch === 'reps') S.reps = Math.max(2, Math.min(60, Math.round(+el.value || 10)));
  else if (ch === 'seed') S.seed = Math.abs(Math.round(+el.value)) || 1;
  else if (ch === 'warmup') S.warmup = Math.max(0, +el.value || 0);
  else if (ch === 'filterAct') S.filterAct = el.value;
  else if (ch === 'filterC') S.filterC = el.value;
  else if (ch === 'objective') S.objective = el.value;
  else if (ch === 'map') importState.map[el.dataset.k] = +el.value;
  else if (ch === 'sd') { const k = el.dataset.k; scenarioDraft[k] = el.type === 'number' ? +el.value : el.value; if (k === 'from') scenarioDraft.to = ''; }
  else if (ch === 'sd-list') { const k = el.dataset.k; const arr = scenarioDraft[k]; if (el.checked) arr.push(el.dataset.v); else scenarioDraft[k] = arr.filter((x) => x !== el.dataset.v); }
  else if (ch === 'fin') S.fin[el.dataset.k] = el.dataset.k === 'includeWait' ? el.value === '1' : +el.value;
  else if (ch === 'scnfin') { const x = st.scenarios.find((s) => s.id === el.dataset.id); if (x) x.fin[el.dataset.k] = +el.value; }
  render();
});
render(); renderDock();
})();
